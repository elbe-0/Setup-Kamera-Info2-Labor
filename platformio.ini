; PlatformIO project for Seeed Studio XIAO ESP32S3 (Sense)
; - Native USB-Serial-JTAG (no UART bridge), upload at offset 0x0
; - 8 MB Flash + 8 MB Octal PSRAM (N8R8 module, ESP32-S3R8)
; - huge_app partition leaves enough room for the Edge Impulse Arduino library
; - esp_camera.h is bundled with arduino-esp32 v3.x; no extra lib_deps needed

[env:xiao_esp32s3_sense]
platform              = espressif32@^6.13.0
board                 = seeed_xiao_esp32s3
framework             = arduino

; ----- USB / serial -----
monitor_speed         = 115200
monitor_filters       = esp32_exception_decoder, time
monitor_rts           = 0       ; do NOT assert RTS on open (would strap GPIO0 low)
monitor_dtr           = 0       ; do NOT assert DTR on open (would reset chip)
upload_speed          = 460800

; PlatformIO's upload step always passes --after=hard_reset and ignores any
; override here.  On USB-Serial-JTAG the RTS-based hard reset can re-strap
; GPIO0 low and bounce the chip back into the bootloader.  The Makefile
; chains a `make reset` (esptool --after watchdog_reset) after every upload
; to leave the chip running the application.

; ----- Flash / PSRAM -----
board_build.flash_mode  = qio
board_build.psram_type  = opi          ; XIAO Sense uses Octal PSRAM (S3R8)

; huge_app.csv = 3 MB app, no OTA, 1 MB SPIFFS.  The default Arduino
; partition reserves only ~1.3 MB for the app, which fits this sketch
; fine but is too small once you add the Edge Impulse Arduino library
; (a MobileNet model is ~1.5-2 MB on its own).  Easier to set it now
; than to debug a cryptic linker error later.
board_build.partitions  = huge_app.csv

; ----- Build flags -----
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1   ; expose REPL/Serial over native USB
    -DCORE_DEBUG_LEVEL=3          ; INFO-level logging
